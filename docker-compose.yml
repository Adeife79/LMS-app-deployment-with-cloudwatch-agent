services:
  lms-frontend:
    image: adeife08/lms-frontend:v3
    container_name: lms-frontend-container
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - lms-backend

  lms-backend:
    image: adeife08/lms-backend:v3
    container_name: lms-backend-container
    restart: unless-stopped
    ports:
      - "8009:8000"
    depends_on:
      - db
    environment:
      DB_NAME: lms_db
      DB_USER: lms_user
      DB_PASSWORD: lms_password
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - ./logs:/app/logs

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: lms_db
      POSTGRES_USER: lms_user
      POSTGRES_PASSWORD: lms_password
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: