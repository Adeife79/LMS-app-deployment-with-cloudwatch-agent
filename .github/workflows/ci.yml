name: Continuous Integration

on:
    push:
      branches:
        - main

jobs:
    quality-check:
        name: Quality Check
        runs-on: ubuntu-latest
    
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"

            - name: Install backend dependencies
              working-directory: LMS-Application/lms-backend
              run: |
                pip install -r requirements.txt

            - name: Django system check
              working-directory: LMS-Application/lms-backend
              run: |
                python manage.py check

    build-and-push:
        name: Build Application
        runs-on: ubuntu-latest
        needs: quality-check

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_PASSWORD }}

            - name: Build and Push backend Docker image
              working-directory: LMS-Application/lms-backend
              run: |
                docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/lms-backend:v4 .
                docker push ${{ secrets.DOCKERHUB_USERNAME }}/lms-backend:v4 

            - name: Build and Push frontend Docker image
              working-directory: LMS-Application/lms-frontend
              run: |
                docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/lms-frontend:v4 .
                docker push ${{ secrets.DOCKERHUB_USERNAME }}/lms-frontend:v4 

            
        
