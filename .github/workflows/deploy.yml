name: Application Deployment

on:
  workflow_dispatch
#  workflow_run:
#        workflows: ["Continuous Integration"]
#        types:
#            - completed
#        branches:
#            - main

env:
    AWS_REGION: eu-north-1

jobs:
    deploy:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3
            

            - name: Debug GitHub OIDC claims
              shell: bash
              run: |
                python3 - <<'PY'
                import os
                import json
                import base64
                import urllib.request

                url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
                token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

                req = urllib.request.Request(
                    url + "&audience=sts.amazonaws.com",
                    headers={"Authorization": f"bearer {token}"}
                )

                with urllib.request.urlopen(req) as response:
                    oidc = json.load(response)

                jwt = oidc["value"]
                payload = jwt.split(".")[1]
                payload += "=" * (-len(payload) % 4)

                claims = json.loads(
                    base64.urlsafe_b64decode(payload)
                )

                for key in ["iss", "aud", "sub", "repository", "repository_owner", "ref"]:
                    print(f"{key}: {claims.get(key)}")
                PY


            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v3
              with:
                role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-role
                aws-region: ${{ env.AWS_REGION }}


            - name: Create LMS Application EC2 Instance
              run: |
                INSTANCE_ID=$(aws ec2 run-instances \
                  --image-id ${{ secrets.AWS_AMI_ID }} \
                  --instance-type t3.micro \
                  --key-name lms-key \
                  --security-group-ids ${{ secrets.AWS_SECURITY_GROUP_ID }} \
                  --subnet-id ${{ secrets.AWS_SUBNET_ID }} \
                  --iam-instance-profile Name=EC2-SSM-Role \
                  --query 'Instances[0].InstanceId' \
                  --output text \
                  --tag-specifications 'ResourceType=instance, Tags=[{Key=Name,Value=lms-instance}]')

                echo "EC2 Instance created with ID: $INSTANCE_ID"
                echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"


            - name: Describe EC2 Instance
              run: |
                echo "Instance ID: $INSTANCE_ID"

                aws ec2 describe-instances \
                  --instance-ids "$INSTANCE_ID" \
                  --query 'Reservations[0].Instances[0].{State:State.Name,StateReason:StateReason,InstanceType:InstanceType,AMI:ImageId,AZ:Placement.AvailabilityZone}' \
                  --output table

                
            - name: Wait for EC2 Instance to be running
              run: |
                echo "Instance ID: $INSTANCE_ID"
                aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
                echo "EC2 Instance is now running."

            - name: Associate Elastic IP
              run: |
                echo "Associating Elastic IP with $INSTANCE_ID"

                aws ec2 associate-address \
                  --instance-id "$INSTANCE_ID" \
                  --allocation-id "${{ secrets.AWS_EIP_ALLOCATION_ID }}" \
                  --allow-reassociation

                echo "Elastic IP associated successfully."

            - name: Get Elastic IP
              run: |
                ELASTIC_IP=$(aws ec2 describe-addresses \
                  --allocation-ids "${{ secrets.AWS_EIP_ALLOCATION_ID }}" \
                  --query 'Addresses[0].PublicIP' \
                  --output text)

                echo "Elastic IP: $ELASTIC_IP"
                echo "ELASTIC_IP=$ELASTIC_IP" >> "$GITHUB_ENV"


            - name: Wait for SSM registration
              run: |
                for i in $(seq 1 20); do
                  STATUS=$(aws ssm describe-instance-information \
                    --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
                    --query "InstanceInformationList[0].PingStatus" \
                    --output text 2>/dev/null)
                  echo "Attempt $i: PingStatus=$STATUS"
                  if [ "$STATUS" == "Online" ]; then
                    echo "Instance is online in SSM."
                    exit 0
                  fi
                  sleep 10
                done
                echo "Instance never registered with SSM after 200s"
                exit 1


            - name: Get Public IP of EC2 Instance
              id: get_public_ip
              run: |
                echo "Using Elastic IP: $ELASTIC_IP"
                echo "PUBLIC_IP=$PUBLIC_IP" >> "$GITHUB_OUTPUT"


            - name: Install CloudWatch Agent
              shell: bash
              run: |
                COMMAND_ID=$(aws ssm send-command \
                  --instance-ids "$INSTANCE_ID" \
                  --document-name "AWS-RunShellScript" \
                  --comment "Install CloudWatch Agent" \
                  --parameters 'commands=[
                    "sudo dnf install -y amazon-cloudwatch-agent"
                  ]' \
                  --query "Command.CommandId" \
                  --output text)

                echo "CloudWatch installation command: $COMMAND_ID"

                aws ssm wait command-executed \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" \
                  --output json



            - name: Configure CloudWatch Agent
              shell: bash
              run: |
                CONFIG=$(base64 -w 0 monitoring/cloudwatch-agent.json)

                COMMAND_ID=$(aws ssm send-command \
                  --instance-ids "$INSTANCE_ID" \
                  --document-name "AWS-RunShellScript" \
                  --comment "Configure CloudWatch Agent" \
                  --parameters "commands=[
                    \"sudo mkdir -p /opt/aws/amazon-cloudwatch-agent/etc\",
                    \"echo '$CONFIG' | base64 -d | sudo tee /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json > /dev/null\"
                  ]" \
                  --query "Command.CommandId" \
                  --output text)

                echo "CloudWatch configuration command: $COMMAND_ID"

                aws ssm wait command-executed \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" \
                  --output json


            - name: Start CloudWatch Agent
              shell: bash
              run: |
                COMMAND_ID=$(aws ssm send-command \
                  --instance-ids "$INSTANCE_ID" \
                  --document-name "AWS-RunShellScript" \
                  --comment "Start CloudWatch Agent" \
                  --parameters 'commands=[
                    "sudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json -s"
                  ]' \
                  --query "Command.CommandId" \
                  --output text)

                echo "CloudWatch start command: $COMMAND_ID"

                aws ssm wait command-executed \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" \
                  --output json

            
            - name: Deploy Application to EC2 via SSM
              shell: bash
              run: |
                COMMAND_ID=$(aws ssm send-command \
                      --instance-ids "$INSTANCE_ID" \
                      --document-name "AWS-RunShellScript" \
                      --comment "Deploy LMS application" \
                      --parameters '{"commands":[
                        "sudo dnf update -y 2>/dev/null",
                        "sudo dnf install -y docker git 2>/dev/null",
                        "sudo systemctl start docker || true",
                        "sudo systemctl enable docker || true",

                        "sudo mkdir -p /usr/local/lib/docker/cli-plugins || true",
                        "sudo curl -SL https://github.com/docker/compose/releases/download/v5.5.0/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose || true",
                        "sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose || true",

                        "docker compose version || true",
                        "git --version || true",
                        "sudo usermod -aG docker ec2-user",

                        "if [ -d /home/ec2-user/LMS-app-deployment-with-cloudwatch-agent ]; then cd /home/ec2-user/LMS-app-deployment-with-cloudwatch-agent && sudo git pull origin main; else sudo git clone https://github.com/Adeife79/LMS-app-deployment-with-cloudwatch-agent.git /home/ec2-user/LMS-app-deployment-with-cloudwatch-agent && cd /home/ec2-user/LMS-app-deployment-with-cloudwatch-agent; fi",

                        "sudo mkdir -p /home/ec2-user/LMS-app-deployment-with-cloudwatch-agent/logs",
                        "sudo chmod 777 /home/ec2-user/LMS-app-deployment-with-cloudwatch-agent/logs",
                        
                        "echo '\''${{ secrets.DOCKERHUB_PASSWORD }}'\'' | sudo docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin",
                        "cd /home/ec2-user/LMS-app-deployment-with-cloudwatch-agent && sudo docker compose pull",
                        "cd /home/ec2-user/LMS-app-deployment-with-cloudwatch-agent && sudo docker compose up -d"
                      ]}' \
                      --query "Command.CommandId" \
                      --output text)

                    echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV
                    echo "Deploy command sent: $COMMAND_ID"


            - name: Wait for deployment to finish
              run: |
                aws ssm wait command-executed \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID"


            - name: Show deployment output
              if: always()
              run: |
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" \
                  --output json

                echo "Deployment completed."

    monitoring:
      needs: deploy
      runs-on: ubuntu-latest

      permissions:
        contents: read
        id-token: write

      steps:

        - name: Checkout repository
          uses: actions/checkout@v4


        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-role
            aws-region: ${{ env.AWS_REGION }}

        - name: Find existing Monitoring EC2
          id: find_monitoring
          shell: bash
          run: |
            INSTANCE_ID=$(aws ec2 describe-instances \
              --filters \
                "Name=tag:Name,Values=LMS-Monitoring" \
                "Name=instance-state-name,Values=pending,running,stopping,stopped" \
              --query 'Reservations[].Instances[0].InstanceId' \
              --output text)

            if [ "$INSTANCE_ID" != "None" ] && [ -n "$INSTANCE_ID" ]; then
              echo "Monitoring EC2 already exists: $INSTANCE_ID"

              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
            else
              echo "No existing Monitoring EC2 found."

              echo "exists=false" >> "$GITHUB_OUTPUT"
            fi

        - name: Create Monitoring EC2 Instance
          if: steps.find_monitoring.outputs.exists == 'false'
          shell: bash
          run: |
            INSTANCE_ID=$(aws ec2 run-instances \
              --image-id "${{secrets.MONITORING_AMI_ID }}" \
              --instance-type t3.micro \
              --security-group-ids "${{ secrets.MONITORING_SECURITY_GROUP_ID }}" \
              --subnet-id "${{ secrets.AWS_SUBNET_ID }}" \
              --iam-instance-profile Name=PrometheusMonitoringEC2Role \
              --query 'Instances[0].InstanceId' \
              --output text \
              --tag-specifications \
              'ResourceType=instance,Tags=[{Key=Name,Value=LMS-Monitoring}]')

            echo "Monitoring EC2 einstance created: $INSTANCE_ID"
            echo "MONITORING_INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"

        - name: Wait for Monitoring EC2 Instance
          run: |
            aws ec2 wait instance-running \
              --instance-ids "$MONITORING_INSTANCE_ID"
            echo "Monitoring EC2 Instance is now running."

          
        - name: Associate Monitoring Elastic IP
          run: |
            echo "Associating Elastic IP with $INSTANCE_ID"

            aws ec2 associate-address \
              --instance-id "$MONITORING_INSTANCE_ID" \
              --allocation-id "${{ secrets.MONITORING_EIP_ALLOCATION_ID }}" \
              --allow-reassociation

            echo "Monitoring Elastic IP associated successfully."

        - name: Get Monitoring Elastic IP
          run: |
            MONITORING_IP=$(aws ec2 describe-addresses \
              --allocation-ids "${{ secrets.MONITORING_EIP_ALLOCATION_ID }}" \
              --query 'Addresses[0].PublicIp' \
              --output text)

            echo "Monitoring EIP: $MONITORING_IP"
            echo "MONITORING_IP=$MONITORING_IP" >> "$GITHUB_ENV"


        - name: Wait for Monitoring SSM registration
          run: |
            for i in $(seq 1 20); do
                  STATUS=$(aws ssm describe-instance-information \
                    --filters "Key=InstanceIds,Values=$MONITORING_INSTANCE_ID" \
                    --query "InstanceInformationList[0].PingStatus" \
                    --output text 2>/dev/null)
                  echo "Attempt $i: PingStatus=$STATUS"
                  if [ "$STATUS" == "Online" ]; then
                    echo "Instance is online in SSM."
                    exit 0
                  fi
                  sleep 10
                done
                echo "Monitoring Instance never registered with SSM after 200s"
                exit 1

        - name: Setup Monitoring Stack
          shell: bash
          run: |
            echo "Setting up Docker, Prometheus and Grafana on Monitoring EC2 Instance..."

            COMPOSE_CONFIG=$(base64 -w 0 monitoring/docker-compose.yml)
            PROMETHEUS_CONFIG=$(base64 -w 0 monitoring/prometheus/prometheus.yml)

            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$MONITORING_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Install Docker and deploy monitoring stack" \
              --parameters "commands=[
                \"sudo apt-get update -y\",
                \"sudo apt-get install -y ca-certificates curl\",
                \"curl -fsSL https://get.docker.com | sudo sh\",
                \"sudo systemctl enable docker\",
                \"sudo systemctl start docker\",
                \"sudo mkdir -p /home/ubuntu/monitoring/prometheus\",
                \"echo '$COMPOSE_CONFIG' | base64 -d | sudo tee /home/ubuntu/monitoring/docker-compose.yml > /dev/null\",
                \"echo '$PROMETHEUS_CONFIG' | base64 -d | sudo tee /home/ubuntu/monitoring/prometheus/prometheus.yml > /dev/null\",
                \"cd /home/ubuntu/monitoring && sudo docker compose pull\",
                \"cd /home/ubuntu/monitoring && sudo docker compose up -d\",
                \"cd /home/ubuntu/monitoring && sudo docker ps\"
              ]" \
              --query "Command.CommandId" \
              --output text)

              echo "Monitoring setup command: $COMMAND_ID"

              if [ -z "$COMMAND_ID" ] || [ "$COMMAND_ID" = "None" ]; then
                echo "ERROR: SSM command was not created."
                exit 1
              fi

              echo "Waiting for monitoring setup to finish..."

              for i in $(seq 1 60); do

                STATUS=$(aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$MONITORING_INSTANCE_ID" \
                  --query "Status" \
                  --output text 2>/dev/null)

                echo "Attempt $i/60: Status=$STATUS"

                case "$STATUS" in
                  Success)
                    echo "Monitoring setup completed successfully."
                    break
                    ;;

                  Failed|Cancelled|TimedOut|Cancelling)
                    echo "Monitoring setup failed."

                    aws ssm get-command-invocation \
                      --command-id "$COMMAND_ID" \
                      --instance-id "$MONITORING_INSTANCE_ID" \
                      --query "{Status:Status,StatusDetails:StatusDetails,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" \
                      --output json

                    exit 1
                    ;;

                  Pending|InProgress)
                    sleep 10
                    ;;

                  *)
                    echo "Unknown SSM status: $STATUS"
                    sleep 10
                    ;;
                esac

              done

              if [ "$STATUS" != "Success" ]; then
                echo "Monitoring setup did not finish within the expected time."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$MONITORING_INSTANCE_ID" \
                  --query "{Status:Status,StatusDetails:StatusDetails,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" \
                  --output json

                exit 1
              fi

              echo "========== MONITORING SETUP RESULT =========="

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$MONITORING_INSTANCE_ID" \
                --query "{Status:Status,StatusDetails:StatusDetails,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" \
                --output json